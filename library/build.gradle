apply plugin: 'com.android.library'

android {
    namespace 'jp.co.cyberagent.android.gpuimage'
    compileSdk 35
    ndkVersion "28.0.12433566"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        versionCode = VERSION_CODE
        versionName = VERSION_NAME

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jni.srcDirs = ['jni']
        }

        // instrumentTest.setRoot('tests')  // Deprecated in modern Gradle
    }

    lintOptions {
        abortOnError false
    }

    android.libraryVariants.all { variant ->
        if (variant.buildType.isDebuggable()) {
            return; // Skip debug builds.
        }
        task("javadoc${variant.name.capitalize()}", type: Javadoc) {
            description "Generates Javadoc for $variant.name."
            source = variant.javaCompile.source
            ext.androidJar = System.getenv("ANDROID_HOME") + "/platforms/${android.compileSdkVersion}/android.jar"
            classpath = files(variant.javaCompile.classpath.files) + files(ext.androidJar)
        }

        task("bundleJavadoc${variant.name.capitalize()}", type: Jar) {
            description "Bundles Javadoc into zip for $variant.name."
            archiveClassifier = "javadoc"
            from tasks["javadoc${variant.name.capitalize()}"]
        }
    }
}

apply from: 'android-artifacts.gradle'
//apply from: 'central-publish.gradle'  // Disabled for build testing